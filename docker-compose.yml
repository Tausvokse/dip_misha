services:
  postgres:
    image: postgres:16-alpine
    container_name: parking_reservation_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: parking_reservation
    ports:
      - "5432:5432"
    volumes:
      - parking_reservation_pgdata:/var/lib/postgresql/data

volumes:
  parking_reservation_pgdata:
